backend:
  name: github
  repo: i-am-sarath/trending-prompt-web
  branch: main

site_url: https://trendingprompt.org
display_url: https://trendingprompt.org

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "prompts"
    label: "Prompts"
    label_singular: "Prompt"
    folder: "src/content/prompts"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    sortable_fields: ["date", "title", "trending"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Description"
        name: "description"
        widget: "text"
        hint: "One or two sentences, under 160 characters. Used as the meta description."
      - { label: "Prompt text", name: "prompt", widget: "text" }
      - { label: "Example image", name: "image", widget: "image" }
      - label: "Pinterest image (optional 1000x1500)"
        name: "pinImage"
        widget: "image"
        required: false
        hint: "Leave empty for image-editing prompts. The build makes a 2:3 crop."
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          [
            "image-generation",
            "image-editing",
            "chatgpt",
            "claude",
            "grok",
            "gemini",
            "midjourney",
            "agents",
          ]
        default: "image-editing"
      - label: "Subject"
        name: "subject"
        widget: "string"
        required: false
        hint: "Optional topic slug such as portrait, product, anime, sci-fi. Not a hub slug. Keeps /category/<subject>/."
      - label: "Tool"
        name: "tool"
        widget: "string"
        default: "ChatGPT"
        hint: "ChatGPT, Claude, Grok, Gemini, Midjourney, or another product name."
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Credit", name: "credit", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Trending", name: "trending", widget: "boolean", default: false, required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false }
      - label: "Notes (optional)"
        name: "body"
        widget: "markdown"
        required: false

  - name: "posts"
    label: "Blog"
    label_singular: "Guide"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Description"
        name: "description"
        widget: "text"
        hint: "One or two sentences. Used as the meta description. Keep it near 160 characters."
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Updated", name: "updated", widget: "datetime", required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["guides", "reference", "comparisons", "workflow", "legal", "trends"]
        default: "guides"
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - label: "Author"
        name: "author"
        widget: "string"
        default: "The trendingprompt desk"
      - label: "Related prompt slugs"
        name: "relatedPrompts"
        widget: "list"
        required: false
        hint: "Filename of a prompt without .md. A slug that does not exist fails the build."
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
