backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/trendingprompt   # <-- set this
  branch: main
  # Only needed if you self-host the OAuth relay (see README section "Sveltia GitHub OAuth").
  # Sveltia defaults to its own hosted authenticator; uncomment and point at your Worker to use yours:
  # base_url: https://sveltia-auth.YOURNAME.workers.dev

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "prompts"
    label: "Prompts"
    folder: "src/content/prompts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Prompt Text", name: "prompt", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["sci-fi", "portrait", "fantasy", "product", "logo", "anime", "general"]
        default: "general"
      - { label: "Tool", name: "tool", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime" }
